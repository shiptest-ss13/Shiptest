2026-11-14:
  PhoenixTheRedandEvil:
  - rscadd: Adjusted Derecho cargo bay layouts.
  cablefish, rye-rice (gun sprites):
  - imageadd: New sprites for the Swiss Cheese.
  - rscadd: The DMA unit on the Swiss Cheese now works. Load it with iron rods.
  - rscadd: The Swiss Cheese is now on the black market.
  - balance: Swiss Cheese has faster burst fire, bigger mags, and is chambered in
      4.73 caseless.
  - rscadd: 4.73 caseless is now available for purchase in cargo.
  cablefish, rye-rice (original code, sprites):
  - rscadd: E-20 mining emitter, available on the black market.
  - rscadd: E-20 conversion kits, available on the black market.
  - balance: An E-20 replaces the Rush on the Mudskipper
  - imageadd: New sprites for eoehoma lasers
  - rscdel: Old unbranded scatter laser has been deleted.
2026-11-15:
  Sadhorizon:
  - balance: Amperage now has a tighter spread.
  rye-rice:
  - bugfix: Outpost maps should no longer have space in between their borders and
      edges.
2026-11-18:
  AnomalousPotato:
  - bugfix: You can no longer tackle in the middle of space.
  - bugfix: Tackles will no longer stop in the middle of space.
  - bugfix: You no longer take bonus damage from being thrown at a wall when you tackle
      one.
  - bugfix: Very good tackles now actually grab as stated.
  - rscadd: Tackling a wall now respects armor.
  - balance: A very bad tackle will no longer IRREVERSIBLY paralyze you.
  prodirus:
  - bugfix: Ships no longer lose the ability to bluespace jump after one of their
      helm consoles is destroyed.
  - bugfix: Ships can exit the Frontier while having an accepted mission again.
2026-11-19:
  AnomalousPotato:
  - balance: Adjusted a bunch of autolathe costs. Things are largely cheaper now.
  - rscadd: You can make pizza cutters in an autolathe now.
  prodirus:
  - bugfix: Firing guns should drop clicks less and full auto should not cancel under
      laggy conditions.
  - bugfix: Burst fire should now always have consistent timing.
  - rscadd: Click buffer for firing weapons, so clicking slightly early will fire
      the gun when ready instead of doing nothing
  - bugfix: Weapon firerates should now be accurate to their defines.
  - balance: CM40 and Python slight firerate nerf
  - bugfix: Fixed firerate delay timing to be correct. This leads to firerate being
      increased across the board.
  thearbiber:
  - rscadd: Ruin difficulty adjustment
2026-11-20:
  Gristlebee:
  - bugfix: Reverse Admin Supply Pods
